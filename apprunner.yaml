# AWS App Runner config (managed Node runtime).
# Alternatively, point App Runner at the repo Dockerfile and skip this file.
# Docs: https://docs.aws.amazon.com/apprunner/
version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm build
run:
  runtime-version: 22
  command: node .next/standalone/server.js
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    # Set NEXT_PUBLIC_SITE_URL, FILEPIZZA_SECRET, PEERJS_HOST, etc. as
    # App Runner runtime environment variables / secrets in the console.
