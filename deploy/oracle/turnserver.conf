# coturn config for Zync on an Oracle Cloud Always Free VM.
# coturn reads ephemeral credentials from the SAME Redis instance the Zync app
# writes to (keys: turn/realm/<realm>/user/<user>/key). Keep realm in sync with
# the app's TURN_REALM env var.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# Must match TURN_REALM in the app's environment.
realm=zync.app

# Read long-term credentials from Redis (same DB as the app's REDIS_URL).
# Add `password=...` if your Redis requires auth.
redis-userdb="ip=127.0.0.1 dbname=0 port=6379"

# UDP relay port range — these must be opened in the Oracle Security List AND
# in the instance firewall (see README).
min-port=49152
max-port=65535

# Public IPv4 of the Oracle VM (find with `curl ifconfig.me`).
external-ip=YOUR_PUBLIC_IP

# TLS for turns:5349 — point at your Let's Encrypt cert for turn.<your-domain>.
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

# Hardening
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce=600
