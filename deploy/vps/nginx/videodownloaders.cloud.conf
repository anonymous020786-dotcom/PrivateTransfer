# Classic host-installed NGINX server block (alternative to the containerized
# nginx-proxy). Use this if you run `nginx` directly on the VPS and the app +
# peerjs as containers (or via pm2) on localhost.
#
# Setup:
#   sudo apt install -y nginx
#   sudo cp deploy/vps/nginx/videodownloaders.cloud.conf /etc/nginx/sites-available/videodownloaders.cloud
#   sudo ln -s /etc/nginx/sites-available/videodownloaders.cloud /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d videodownloaders.cloud -d www.videodownloaders.cloud
# certbot rewrites this file to add the TLS listener + auto-renews.

# Redirect www → non-www (canonical). Keeps R2 CORS, auth, and analytics clean.
server {
    listen 80;
    listen [::]:80;
    server_name www.videodownloaders.cloud;
    return 301 https://videodownloaders.cloud$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name videodownloaders.cloud;

    # Stream Server-Sent Events without buffering (live presence/stats).
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64m;

    # Self-hosted PeerJS signaling (WebSocket) at /peerjs/*
    location /peerjs/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
