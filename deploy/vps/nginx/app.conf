# Extra http-level tuning loaded by nginx-proxy (mounted into conf.d).
# - Disable proxy buffering so Server-Sent Events (live presence/stats) stream
#   instantly instead of being buffered.
# - Long read timeout keeps the SSE connection open.
# - Large body size (file bytes are P2P, but be generous for avatar uploads).
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
client_max_body_size 64m;
